[project]
name = "transaction-fraud-detection-platform"
version = "0.1.0"
description = "End-to-end Transaction Fraud Detection Platform (Preprocessing, ML Pipeline, API & Dashboard)"
readme = "README.md"
authors = [
    { name = "namdv1203", email = "namdovan2006@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "gdown>=5.2.0",
    "numpy>=2.1.0",
    "pandas>=2.2.3",
    "pyarrow>=18.0.0",
    "pyyaml>=6.0.2",
    "ruff>=0.17.3",
]

[dependency-groups]
dev = [
    "ipykernel>=6.29.5",
    "matplotlib>=3.9.2",
    "pytest>=8.3.3",
    "ruff>=0.7.0",
    "seaborn>=0.13.2",
]

[project.scripts]
run-preprocessing = "scripts.run_preprocessing:main"
run-training = "scripts.run_training:main"
run-evaluation = "scripts.run_evaluation:main"
run-app = "scripts.run_app:main"

[tool.uv.build-backend]
module-name = "fraud_detection"
module-root = "src"

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests"]

[tool.ruff.lint]
select = ["D", "E", "F", "I"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"
