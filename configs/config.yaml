project:
  name: "transaction-fraud-detection-platform"
  dataset: "sparkov_credit_card_fraud"
  seed: 42

paths:
  raw_data: "data/raw"
  interim_data: "data/interim"
  processed_data: "data/processed"
  models_dir: "models"
  reports_dir: "reports"

data_source:
  gdrive_file_id: "1Nnqnr2tv42mv5Pbtmj1eLSRszjOzbDw3"
  gdrive_url: "https://drive.google.com/file/d/1Nnqnr2tv42mv5Pbtmj1eLSRszjOzbDw3/view?usp=sharing"
  archive_name: "sparkov_fraud.zip"
  train_csv: "fraudTrain.csv"
  test_csv: "fraudTest.csv"
  remove_zip_after_extract: true

preprocessing:
  id_col: "trans_num"
  card_col: "cc_num"
  target_col: "is_fraud"
  timestamp_col: "trans_date_trans_time"
  unix_time_col: "unix_time"
  rename_cols:
    state: "state_code"
    long: "lon"
    merch_long: "merch_lon"
  drop_cols:
    - "Unnamed: 0"
    - "first"
    - "last"
    - "street"
  categorical_cols:
    - "merchant"
    - "category"
    - "gender"
    - "state_code"
    - "job"
  numerical_cols:
    - "amt"
    - "lat"
    - "lon"
    - "city_pop"
    - "merch_lat"
    - "merch_lon"
  val_size: 0.15

training:
  threshold: 0.5

app:
  api_host: "0.0.0.0"
  api_port: 8000
  ui_port: 8501

database:
  url: "sqlite:///database/fraud_detection.db"
  echo: false
